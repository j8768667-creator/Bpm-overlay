<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Audio Editor — Beat Grid & Note Adjust</title>

    <style>
        /* ----- reset & base ----- */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #0d0f14;
            color: #e8edf5;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
            font-size: 15px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        /* ----- no zoom on double-tap ----- */
        button,
        input,
        label,
        canvas,
        .clickable {
            touch-action: manipulation;
        }

        /* ----- layout ----- */
        #app {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 8px 12px 12px 12px;
            background: #0d0f14;
            position: relative;
        }

        /* ----- top toolbar ----- */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 10px;
            padding: 8px 0 10px 0;
            border-bottom: 1px solid #262b33;
            flex-shrink: 0;
            min-height: 56px;
        }

        .toolbar .group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .toolbar .group-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #6e7a8a;
            margin-right: 2px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            background: #1e2530;
            color: #e8edf5;
            font-size: 14px;
            font-weight: 500;
            line-height: 1.2;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
            min-height: 44px;
            min-width: 44px;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            white-space: nowrap;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
            text-decoration: none;
        }

        .btn:active {
            transform: scale(0.95);
            background: #2a3342;
        }

        .btn-primary {
            background: #2b6b9c;
            color: #fff;
        }
        .btn-primary:active {
            background: #1e4f77;
        }

        .btn-success {
            background: #1f8b5a;
            color: #fff;
        }
        .btn-success:active {
            background: #156a44;
        }

        .btn-danger {
            background: #9e3b3b;
            color: #fff;
        }
        .btn-danger:active {
            background: #792d2d;
        }

        .btn:disabled {
            opacity: 0.4;
            transform: none !important;
            pointer-events: none;
        }

        .bpm-input-wrap {
            display: flex;
            align-items: center;
            background: #1a2029;
            border-radius: 8px;
            padding: 0 6px 0 12px;
            border: 1px solid #2e3745;
        }

        .bpm-input-wrap input[type="number"] {
            background: transparent;
            border: none;
            color: #e8edf5;
            font-size: 17px;
            font-weight: 600;
            width: 64px;
            padding: 8px 4px;
            outline: none;
            font-variant-numeric: tabular-nums;
            min-height: 44px;
        }

        .bpm-input-wrap input[type="number"]::-webkit-inner-spin-button,
        .bpm-input-wrap input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .bpm-input-wrap input[type="number"] {
            -moz-appearance: textfield;
        }

        .bpm-input-wrap .bpm-label {
            color: #6e7a8a;
            font-size: 13px;
            font-weight: 500;
            padding-right: 6px;
        }

        /* ----- file input hidden but accessible ----- */
        #fileInput {
            display: none;
        }

        /* ----- waveform container ----- */
        .waveform-wrap {
            flex: 1;
            position: relative;
            min-height: 200px;
            margin-top: 10px;
            background: #11161e;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #242b36;
            touch-action: none;
        }

        #waveformCanvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
            cursor: grab;
            background: #11161e;
        }

        #waveformCanvas:active {
            cursor: grabbing;
        }

        /* ----- bottom info panel ----- */
        .info-panel {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px 12px;
            padding: 10px 4px 4px 4px;
            flex-shrink: 0;
            min-height: 48px;
            border-top: 1px solid #1a2029;
            margin-top: 8px;
        }

        .info-panel .stats {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 20px;
            font-size: 13px;
            color: #8e9aab;
        }

        .info-panel .stats span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .info-panel .stats .val {
            color: #e8edf5;
            font-weight: 500;
            font-variant-numeric: tabular-nums;
        }

        .marker-list {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 8px;
            max-height: 52px;
            overflow-y: auto;
            padding: 2px 0;
            flex: 1;
            min-width: 120px;
        }

        .marker-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px 4px 8px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            background: #1a2029;
            border: 1px solid #2e3745;
            color: #bcc5d4;
            transition: border-color 0.2s;
            touch-action: manipulation;
            min-height: 32px;
        }

        .marker-chip .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .marker-chip .offset {
            font-size: 10px;
            color: #6e7a8a;
            font-weight: 400;
        }

        .marker-chip.selected {
            border-color: #4a8fc5;
            background: #1e3142;
        }

        /* ----- responsive adjustments ----- */
        @media (max-width: 640px) {
            #app {
                padding: 4px 6px 8px 6px;
            }
            .toolbar {
                gap: 4px 6px;
                padding: 4px 0 6px 0;
            }
            .btn {
                padding: 6px 12px;
                font-size: 13px;
                min-height: 38px;
                min-width: 38px;
            }
            .bpm-input-wrap input[type="number"] {
                width: 52px;
                font-size: 15px;
                padding: 6px 2px;
                min-height: 38px;
            }
            .marker-chip {
                font-size: 11px;
                padding: 2px 8px 2px 6px;
                min-height: 28px;
            }
            .info-panel .stats {
                font-size: 12px;
                gap: 8px 14px;
            }
            .waveform-wrap {
                min-height: 140px;
                margin-top: 6px;
            }
        }

        @media (orientation: portrait) and (max-width: 820px) {
            .waveform-wrap {
                min-height: 180px;
            }
        }

        /* scrollbar styling */
        .marker-list::-webkit-scrollbar {
            width: 3px;
            height: 3px;
        }
        .marker-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .marker-list::-webkit-scrollbar-thumb {
            background: #2e3745;
            border-radius: 4px;
        }

        /* loading overlay */
        .loading-overlay {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(13, 15, 20, 0.75);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 10;
            border-radius: 12px;
            font-size: 16px;
            color: #aabbcc;
        }
        .loading-overlay.active {
            display: flex;
        }
        .loading-overlay .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #1e2530;
            border-top-color: #4a8fc5;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 14px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* tooltip for drag */
        .drag-tooltip {
            position: fixed;
            pointer-events: none;
            background: #1a2029cc;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            color: #e8edf5;
            border: 1px solid #2e3745;
            display: none;
            z-index: 100;
            white-space: nowrap;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }
        .drag-tooltip.visible {
            display: block;
        }
        .drag-tooltip .sub {
            font-weight: 400;
            color: #8e9aab;
            font-size: 11px;
        }
    </style>
</head>
<body>

    <div id="app">

        <!-- TOOLBAR -->
        <div class="toolbar">
            <div class="group">
                <button class="btn btn-primary" id="loadBtn">📂 Load</button>
                <input type="file" id="fileInput" accept="audio/*" />
            </div>

            <div class="group">
                <span class="group-label">BPM</span>
                <div class="bpm-input-wrap">
                    <input type="number" id="bpmInput" value="120" min="20" max="300" step="0.5" />
                    <span class="bpm-label">bpm</span>
                </div>
            </div>

            <div class="group">
                <button class="btn btn-success" id="playBtn" disabled>▶ Play</button>
                <button class="btn" id="stopBtn" disabled>⏹ Stop</button>
            </div>

            <div class="group" style="margin-left:auto;">
                <button class="btn" id="detectBtn" disabled>🔍 Detect</button>
                <button class="btn" id="resetMarkersBtn" disabled>↺ Reset</button>
            </div>
        </div>

        <!-- WAVEFORM -->
        <div class="waveform-wrap" id="waveformWrap">
            <canvas id="waveformCanvas"></canvas>
            <div class="loading-overlay" id="loadingOverlay">
                <div class="spinner"></div>
                <span>Processing audio…</span>
            </div>
        </div>

        <!-- INFO PANEL -->
        <div class="info-panel">
            <div class="stats">
                <span>⏱ <span class="val" id="timeDisplay">0:00.0</span></span>
                <span>🎵 <span class="val" id="markerCount">0</span> notes</span>
                <span>📐 <span class="val" id="zoomLevel">1.0×</span></span>
            </div>
            <div class="marker-list" id="markerList"></div>
        </div>

        <!-- DRAG TOOLTIP -->
        <div class="drag-tooltip" id="dragTooltip">
            <span id="dragTooltipText">+0.00</span>
            <span class="sub" id="dragTooltipSub">beats</span>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            //  DOM refs
            // ============================================================
            const canvas = document.getElementById('waveformCanvas');
            const ctx = canvas.getContext('2d');
            const wrap = document.getElementById('waveformWrap');

            const fileInput = document.getElementById('fileInput');
            const loadBtn = document.getElementById('loadBtn');
            const bpmInput = document.getElementById('bpmInput');
            const playBtn = document.getElementById('playBtn');
            const stopBtn = document.getElementById('stopBtn');
            const detectBtn = document.getElementById('detectBtn');
            const resetBtn = document.getElementById('resetMarkersBtn');
            const timeDisplay = document.getElementById('timeDisplay');
            const markerCount = document.getElementById('markerCount');
            const zoomLevel = document.getElementById('zoomLevel');
            const markerList = document.getElementById('markerList');
            const loadingOverlay = document.getElementById('loadingOverlay');
            const dragTooltip = document.getElementById('dragTooltip');
            const dragTooltipText = document.getElementById('dragTooltipText');
            const dragTooltipSub = document.getElementById('dragTooltipSub');

            // ============================================================
            //  State
            // ============================================================
            const state = {
                audioBuffer: null,
                bufferData: null,
                sampleRate: 44100,
                duration: 0,

                isPlaying: false,
                startTime: 0,
                pauseTime: 0,
                currentTime: 0,
                source: null,

                bpm: 120,

                zoom: 120,
                offset: 0,

                markers: [],
                detectedTimes: [],

                dragging: false,
                dragIndex: -1,
                dragStartX: 0,
                dragStartTime: 0,
                dragLastX: 0,

                canvasWidth: 0,
                canvasHeight: 0,

                waveformY: 0,
                waveformHeight: 0,

                audioCtx: null,
                resizeTimer: null,
                fileName: '',
            };

            // ============================================================
            //  AudioContext helpers
            // ============================================================
            function getAudioContext() {
                if (!state.audioCtx) {
                    state.audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                }
                return state.audioCtx;
            }

            function resumeAudioContext() {
                const ctx = getAudioContext();
                if (ctx.state === 'suspended') {
                    return ctx.resume();
                }
                return Promise.resolve();
            }

            // ============================================================
            //  Canvas sizing
            // ============================================================
            function resizeCanvas() {
                const rect = wrap.getBoundingClientRect();
                const dpr = window.devicePixelRatio || 1;
                const w = rect.width;
                const h = rect.height;

                canvas.width = w * dpr;
                canvas.height = h * dpr;
                canvas.style.width = w + 'px';
                canvas.style.height = h + 'px';

                state.canvasWidth = w;
                state.canvasHeight = h;

                ctx.scale(dpr, dpr);

                const marginTop = 16;
                const marginBottom = 16;
                state.waveformY = marginTop;
                state.waveformHeight = h - marginTop - marginBottom;

                render();
            }

            // ============================================================
            //  BPM helpers
            // ============================================================
            function getBeatDuration() {
                return 60 / state.bpm;
            }

            function getBeatIndex(time) {
                return time / getBeatDuration();
            }

            function getBeatOffset(time) {
                const idx = getBeatIndex(time);
                const nearest = Math.round(idx);
                return idx - nearest;
            }

            // ============================================================
            //  Onset detection (simple energy-based)
            // ============================================================
            function detectOnsets(data, sampleRate) {
                if (!data || data.length === 0) return [];

                const winSamples = Math.floor(sampleRate * 0.010);
                const hopSamples = Math.floor(sampleRate * 0.005);
                const envelope = [];

                for (let i = 0; i < data.length - winSamples; i += hopSamples) {
                    let sum = 0;
                    for (let j = 0; j < winSamples; j++) {
                        const v = data[i + j];
                        sum += v * v;
                    }
                    envelope.push(Math.sqrt(sum / winSamples));
                }

                const onsets = [];
                const threshold = 0.04;
                const minDist = Math.floor(sampleRate * 0.035 / hopSamples);

                const deriv = [];
                for (let i = 1; i < envelope.length; i++) {
                    deriv.push(Math.max(0, envelope[i] - envelope[i - 1]));
                }

                let lastPeak = -minDist;
                for (let i = 1; i < deriv.length - 1; i++) {
                    if (deriv[i] > deriv[i - 1] && deriv[i] > deriv[i + 1] && deriv[i] > threshold) {
                        const time = (i * hopSamples) / sampleRate;
                        if (time > 0.05 && time < state.duration - 0.05) {
                            if (i - lastPeak >= minDist) {
                                onsets.push(time);
                                lastPeak = i;
                            }
                        }
                    }
                }

                if (onsets.length < 3 && envelope.length > 100) {
                    const threshold2 = 0.025;
                    const onsets2 = [];
                    let lastPeak2 = -minDist;
                    for (let i = 1; i < deriv.length - 1; i++) {
                        if (deriv[i] > deriv[i - 1] && deriv[i] > deriv[i + 1] && deriv[i] > threshold2) {
                            const time = (i * hopSamples) / sampleRate;
                            if (time > 0.05 && time < state.duration - 0.05) {
                                if (i - lastPeak2 >= minDist) {
                                    onsets2.push(time);
                                    lastPeak2 = i;
                                }
                            }
                        }
                    }
                    if (onsets2.length >= 2) return onsets2;
                }

                return onsets;
            }

            // ============================================================
            //  Marker management
            // ============================================================
            function addMarker(time) {
                time = Math.max(0, Math.min(time, state.duration));
                const offset = getBeatOffset(time);
                state.markers.push({ time, beatOffset: offset, selected: false });
                state.markers.sort((a, b) => a.time - b.time);
                updateUI();
                render();
            }

            function clearMarkers() {
                state.markers = [];
                updateUI();
                render();
            }

            function resetMarkersToDetected() {
                clearMarkers();
                for (const t of state.detectedTimes) {
                    addMarker(t);
                }
                render();
            }

            // ============================================================
            //  Rendering
            // ============================================================
            function render() {
                const w = state.canvasWidth;
                const h = state.canvasHeight;
                if (w === 0 || h === 0) return;

                ctx.clearRect(0, 0, w, h);
                ctx.fillStyle = '#11161e';
                ctx.fillRect(0, 0, w, h);

                const data = state.bufferData;
                if (!data || state.duration === 0) {
                    drawEmptyState(w, h);
                    return;
                }

                const totalSamples = data.length;
                const duration = state.duration;
                const zoom = state.zoom;
                const offset = state.offset;

                const startTime = offset;
                const endTime = offset + w / zoom;
                const startSample = Math.floor(startTime * state.sampleRate);
                const endSample = Math.min(Math.ceil(endTime * state.sampleRate), totalSamples);
                const visibleSamples = endSample - startSample;

                if (visibleSamples <= 0) {
                    drawEmptyState(w, h);
                    return;
                }

                const y0 = state.waveformY;
                const yH = state.waveformHeight;
                const midY = y0 + yH / 2;
                const ampScale = yH * 0.45;
                const step = Math.max(1, Math.floor(visibleSamples / w));

                ctx.beginPath();
                ctx.moveTo(0, midY);
                let first = true;
                for (let px = 0; px < w; px++) {
                    const sampleIdx = startSample + px * step;
                    if (sampleIdx >= totalSamples) break;
                    const idx = Math.min(sampleIdx, totalSamples - 1);
                    const val = data[idx];
                    const x = px;
                    const y = midY - val * ampScale;
                    if (first) { ctx.moveTo(x, y);
                        first = false; } else ctx.lineTo(x, y);
                }
                ctx.strokeStyle = '#4a7a9c';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, midY);
                for (let px = 0; px < w; px++) {
                    const sampleIdx = startSample + px * step;
                    if (sampleIdx >= totalSamples) break;
                    const idx = Math.min(sampleIdx, totalSamples - 1);
                    const val = data[idx];
                    const x = px;
                    const y = midY - val * ampScale;
                    ctx.lineTo(x, y);
                }
                ctx.lineTo(w, midY);
                ctx.closePath();
                ctx.fillStyle = 'rgba(42, 90, 120, 0.15)';
                ctx.fill();

                // ---- BEAT GRID ----
                const beatDur = getBeatDuration();
                const firstBeat = Math.floor(startTime / beatDur);
                const lastBeat = Math.ceil(endTime / beatDur);

                for (let bi = firstBeat; bi <= lastBeat; bi++) {
                    const t = bi * beatDur;
                    if (t < 0) continue;
                    const px = (t - startTime) * zoom;
                    if (px < -10 || px > w + 10) continue;

                    ctx.beginPath();
                    ctx.moveTo(px, y0);
                    ctx.lineTo(px, y0 + yH);
                    ctx.strokeStyle = 'rgba(80, 160, 220, 0.35)';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    for (let sub = 2; sub <= 4; sub *= 2) {
                        for (let i = 1; i < sub; i++) {
                            const st = t + (i / sub) * beatDur;
                            if (st > endTime + 0.01) break;
                            const spx = (st - startTime) * zoom;
                            if (spx < -5 || spx > w + 5) continue;
                            ctx.beginPath();
                            ctx.moveTo(spx, y0 + (sub === 2 ? yH * 0.15 : yH * 0.30));
                            ctx.lineTo(spx, y0 + yH - (sub === 2 ? yH * 0.15 : yH * 0.30));
                            ctx.strokeStyle = sub === 2 ?
                                'rgba(80, 160, 220, 0.18)' :
                                'rgba(80, 160, 220, 0.10)';
                            ctx.lineWidth = sub === 2 ? 1 : 0.7;
                            ctx.stroke();
                        }
                    }

                    if (bi % 4 === 0 && bi >= 0) {
                        const label = (bi / 4) + 1;
                        ctx.fillStyle = 'rgba(120, 180, 220, 0.25)';
                        ctx.font = '10px -apple-system, sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'bottom';
                        ctx.fillText(label, px, y0 - 2);
                    }
                }

                // ---- MARKERS ----
                const markerRadius = 6;
                for (let i = 0; i < state.markers.length; i++) {
                    const m = state.markers[i];
                    const px = (m.time - startTime) * zoom;
                    if (px < -20 || px > w + 20) continue;

                    const offset = m.beatOffset;
                    const absOff = Math.abs(offset);
                    let color;
                    if (absOff < 0.05) color = '#4ade80';
                    else if (absOff < 0.15) color = '#facc15';
                    else if (absOff < 0.30) color = '#fb923c';
                    else color = '#f87171';

                    const isSelected = m.selected || (state.dragging && state.dragIndex === i);

                    const grad = ctx.createRadialGradient(px, y0 + yH * 0.5, 2, px, y0 + yH * 0.5, 28);
                    grad.addColorStop(0, color + '60');
                    grad.addColorStop(1, 'transparent');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(px, y0 + yH * 0.5, 28, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.beginPath();
                    ctx.moveTo(px, y0 + 4);
                    ctx.lineTo(px, y0 + yH - 4);
                    ctx.strokeStyle = isSelected ? '#ffffff' : color;
                    ctx.lineWidth = isSelected ? 3 : 2;
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(px, y0 + yH * 0.5, markerRadius, 0, Math.PI * 2);
                    ctx.fillStyle = isSelected ? '#ffffff' : color;
                    ctx.fill();
                    ctx.strokeStyle = '#11161e';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();

                    if (absOff > 0.01) {
                        const label = (offset > 0 ? '+' : '') + offset.toFixed(2);
                        ctx.fillStyle = absOff < 0.15 ? '#facc15' : '#fb923c';
                        ctx.font = '9px -apple-system, monospace';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'bottom';
                        ctx.fillText(label, px, y0 + 2);
                    }

                    const beatNum = Math.round(getBeatIndex(m.time));
                    ctx.fillStyle = 'rgba(200,220,240,0.25)';
                    ctx.font = '8px -apple-system, monospace';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'top';
                    ctx.fillText('b' + beatNum, px, y0 + yH - 12);
                }

                // ---- playhead ----
                if (state.isPlaying || state.pauseTime > 0) {
                    const t = state.isPlaying ? state.currentTime : state.pauseTime;
                    const px = (t - startTime) * zoom;
                    if (px >= 0 && px <= w) {
                        ctx.beginPath();
                        ctx.moveTo(px, y0);
                        ctx.lineTo(px, y0 + yH);
                        ctx.strokeStyle = 'rgba(255,255,255,0.6)';
                        ctx.lineWidth = 2;
                        ctx.setLineDash([4, 6]);
                        ctx.stroke();
                        ctx.setLineDash([]);

                        ctx.beginPath();
                        ctx.moveTo(px, y0 - 2);
                        ctx.lineTo(px - 6, y0 - 10);
                        ctx.lineTo(px + 6, y0 - 10);
                        ctx.closePath();
                        ctx.fillStyle = 'rgba(255,255,255,0.7)';
                        ctx.fill();
                    }
                }
            }

            function drawEmptyState(w, h) {
                ctx.fillStyle = '#1a2029';
                ctx.font = '16px -apple-system, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#4a5a6a';
                ctx.fillText('Load an audio file to begin', w / 2, h / 2 - 10);
                ctx.font = '13px -apple-system, sans-serif';
                ctx.fillStyle = '#3a4a5a';
                ctx.fillText('Tap "Load" to import audio', w / 2, h / 2 + 28);
            }

            // ============================================================
            //  UI update
            // ============================================================
            function updateUI() {
                markerCount.textContent = state.markers.length;

                markerList.innerHTML = '';
                for (let i = 0; i < state.markers.length && i < 30; i++) {
                    const m = state.markers[i];
                    const chip = document.createElement('span');
                    chip.className = 'marker-chip' + (m.selected ? ' selected' : '');
                    const offset = m.beatOffset;
                    const absOff = Math.abs(offset);
                    let dotColor;
                    if (absOff < 0.05) dotColor = '#4ade80';
                    else if (absOff < 0.15) dotColor = '#facc15';
                    else if (absOff < 0.30) dotColor = '#fb923c';
                    else dotColor = '#f87171';

                    chip.innerHTML = `
                    <span class="dot" style="background:${dotColor}"></span>
                    #${i+1}
                    <span class="offset">${offset > 0 ? '+' : ''}${offset.toFixed(2)}</span>
                  `;
                    chip.dataset.index = i;
                    chip.addEventListener('click', () => selectMarker(i));
                    chip.addEventListener('touchend', (e) => { e.preventDefault();
                        selectMarker(i); });
                    markerList.appendChild(chip);
                }

                zoomLevel.textContent = state.zoom.toFixed(0) + '×';
            }

            function selectMarker(index) {
                state.markers.forEach((m, i) => m.selected = (i === index));
                updateUI();
                render();
            }

            // ============================================================
            //  Playback
            // ============================================================
            async function playAudio() {
                if (!state.audioBuffer) return;
                await resumeAudioContext();

                const ctx = getAudioContext();

                if (state.isPlaying) {
                    state.isPlaying = false;
                    state.pauseTime = state.currentTime;
                    if (state.source) {
                        try { state.source.stop(); } catch (_) {}
                        state.source = null;
                    }
                    playBtn.textContent = '▶ Play';
                    render();
                    return;
                }

                let startFrom = state.pauseTime > 0 ? state.pauseTime : 0;
                if (startFrom >= state.duration - 0.01) startFrom = 0;

                state.currentTime = startFrom;
                state.pauseTime = 0;

                try {
                    state.source = ctx.createBufferSource();
                    state.source.buffer = state.audioBuffer;

                    const gainNode = ctx.createGain();
                    gainNode.gain.value = 0.8;
                    state.source.connect(gainNode);
                    gainNode.connect(ctx.destination);

                    state.source.start(0, startFrom);
                    state.startTime = ctx.currentTime - startFrom;
                    state.isPlaying = true;
                    playBtn.textContent = '⏸ Pause';

                    state.source.onended = () => {
                        if (state.isPlaying) {
                            state.isPlaying = false;
                            state.currentTime = state.duration;
                            state.pauseTime = state.duration;
                            playBtn.textContent = '▶ Play';
                            render();
                            updateTimeDisplay();
                        }
                    };

                    updatePlayhead();

                } catch (err) {
                    console.error('Playback error:', err);
                    state.isPlaying = false;
                    playBtn.textContent = '▶ Play';
                }
            }

            function stopAudio() {
                if (state.source) {
                    try { state.source.stop(); } catch (_) {}
                    state.source = null;
                }
                state.isPlaying = false;
                state.currentTime = 0;
                state.pauseTime = 0;
                playBtn.textContent = '▶ Play';
                render();
                updateTimeDisplay();
            }

            function updatePlayhead() {
                if (!state.isPlaying) return;
                const ctx = getAudioContext();
                state.currentTime = ctx.currentTime - state.startTime;
                if (state.currentTime >= state.duration) {
                    state.currentTime = state.duration;
                    state.isPlaying = false;
                    state.pauseTime = state.duration;
                    playBtn.textContent = '▶ Play';
                    render();
                    updateTimeDisplay();
                    return;
                }
                render();
                updateTimeDisplay();
                requestAnimationFrame(updatePlayhead);
            }

            function updateTimeDisplay() {
                const t = state.isPlaying ? state.currentTime : (state.pauseTime || 0);
                const mins = Math.floor(t / 60);
                const secs = Math.floor(t % 60);
                const tenths = Math.floor((t % 1) * 10);
                timeDisplay.textContent = `${mins}:${String(secs).padStart(2,'0')}.${tenths}`;
            }

            // ============================================================
            //  Load audio
            // ============================================================
            async function loadAudioFile(file) {
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async (e) => {
                    try {
                        loadingOverlay.classList.add('active');
                        const arrayBuffer = e.target.result;
                        const ctx = getAudioContext();
                        const audioBuffer = await ctx.decodeAudioData(arrayBuffer);
                        state.audioBuffer = audioBuffer;
                        state.sampleRate = audioBuffer.sampleRate;
                        state.duration = audioBuffer.duration;

                        const numChannels = audioBuffer.numberOfChannels;
                        const length = audioBuffer.length;
                        const mono = new Float32Array(length);
                        if (numChannels === 1) {
                            mono.set(audioBuffer.getChannelData(0));
                        } else {
                            const left = audioBuffer.getChannelData(0);
                            const right = audioBuffer.getChannelData(1);
                            for (let i = 0; i < length; i++) {
                                mono[i] = (left[i] + right[i]) * 0.5;
                            }
                        }
                        state.bufferData = mono;

                        state.markers = [];
                        state.detectedTimes = [];
                        state.currentTime = 0;
                        state.pauseTime = 0;
                        state.isPlaying = false;
                        state.offset = 0;
                        state.zoom = Math.max(60, Math.min(400, state.canvasWidth / state.duration * 0.8));

                        playBtn.disabled = false;
                        stopBtn.disabled = false;
                        detectBtn.disabled = false;
                        resetBtn.disabled = false;

                        loadingOverlay.querySelector('span').textContent = 'Detecting notes…';
                        await new Promise(r => setTimeout(r, 50));
                        state.detectedTimes = detectOnsets(state.bufferData, state.sampleRate);
                        resetMarkersToDetected();

                        loadingOverlay.classList.remove('active');
                        loadingOverlay.querySelector('span').textContent = 'Processing audio…';

                        updateUI();
                        render();
                        updateTimeDisplay();
                        state.fileName = file.name;

                    } catch (err) {
                        console.error('Load error:', err);
                        loadingOverlay.classList.remove('active');
                        alert('Failed to load audio: ' + err.message);
                    }
                };
                reader.onerror = () => {
                    loadingOverlay.classList.remove('active');
                    alert('Failed to read file.');
                };
                reader.readAsArrayBuffer(file);
            }

            // ============================================================
            //  Touch / Mouse interaction (drag markers)
            // ============================================================
            function getPointerPos(e) {
                const rect = canvas.getBoundingClientRect();
                let clientX, clientY;
                if (e.touches) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }
                const x = (clientX - rect.left) * (state.canvasWidth / rect.width);
                const y = (clientY - rect.top) * (state.canvasHeight / rect.height);
                return { x, y, clientX, clientY };
            }

            function findMarkerAt(x, y) {
                const tolerance = 20;
                const startTime = state.offset;
                const zoom = state.zoom;
                for (let i = state.markers.length - 1; i >= 0; i--) {
                    const m = state.markers[i];
                    const px = (m.time - startTime) * zoom;
                    if (Math.abs(px - x) < tolerance) {
                        return i;
                    }
                }
                return -1;
            }

            function startDrag(e) {
                if (!state.bufferData || state.markers.length === 0) return;
                const pos = getPointerPos(e);
                const idx = findMarkerAt(pos.x, pos.y);
                if (idx === -1) return;

                e.preventDefault();

                state.dragging = true;
                state.dragIndex = idx;
                state.dragStartX = pos.x;
                state.dragStartTime = state.markers[idx].time;
                state.dragLastX = pos.x;

                state.markers.forEach((m, i) => m.selected = (i === idx));
                updateUI();
                render();

                dragTooltip.classList.add('visible');
                updateDragTooltip(idx, pos.clientX, pos.clientY);

                document.body.style.overflow = 'hidden';
            }

            function moveDrag(e) {
                if (!state.dragging || state.dragIndex === -1) return;
                e.preventDefault();

                const pos = getPointerPos(e);
                const dx = pos.x - state.dragStartX;
                const newTime = state.dragStartTime + dx / state.zoom;
                const clamped = Math.max(0, Math.min(newTime, state.duration));

                state.dragLastX = pos.x;

                state.markers[state.dragIndex].time = clamped;
                state.markers[state.dragIndex].beatOffset = getBeatOffset(clamped);
                state.markers.sort((a, b) => a.time - b.time);

                const newIdx = state.markers.findIndex(m => m.time === clamped && m.beatOffset === getBeatOffset(clamped));
                if (newIdx !== -1) state.dragIndex = newIdx;

                updateUI();
                render();

                updateDragTooltip(state.dragIndex, pos.clientX, pos.clientY);
            }

            function endDrag(e) {
                if (!state.dragging) return;
                state.dragging = false;
                state.dragIndex = -1;
                dragTooltip.classList.remove('visible');
                document.body.style.overflow = '';
                render();
            }

            function updateDragTooltip(index, cx, cy) {
                if (index < 0 || index >= state.markers.length) return;
                const m = state.markers[index];
                const off = m.beatOffset;
                const absOff = Math.abs(off);
                let color = '#4ade80';
                if (absOff > 0.30) color = '#f87171';
                else if (absOff > 0.15) color = '#fb923c';
                else if (absOff > 0.05) color = '#facc15';

                dragTooltipText.textContent = (off > 0 ? '+' : '') + off.toFixed(3);
                dragTooltipText.style.color = color;
                dragTooltipSub.textContent = 'beats from grid';

                let left = cx + 16;
                let top = cy - 20;
                const tw = 180;
                const th = 44;
                if (left + tw > window.innerWidth - 10) left = cx - tw - 16;
                if (top + th > window.innerHeight - 10) top = cy - th - 10;
                if (top < 10) top = 10;
                dragTooltip.style.left = left + 'px';
                dragTooltip.style.top = top + 'px';
            }

            // ============================================================
            //  Zoom & pan
            // ============================================================
            function handlePinch(e) {
                e.preventDefault();
                if (!state.bufferData) return;
                if (e.touches && e.touches.length === 2) {
                    const t1 = e.touches[0];
                    const t2 = e.touches[1];
                    const dist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
                    if (state._lastPinchDist) {
                        const delta = dist - state._lastPinchDist;
                        const factor = 1 + delta * 0.005;
                        const newZoom = Math.max(20, Math.min(800, state.zoom * factor));
                        state.zoom = newZoom;
                        render();
                        updateUI();
                    }
                    state._lastPinchDist = dist;
                }
            }

            function handlePan(e) {
                if (state.dragging) return;
                if (!state.bufferData) return;
                e.preventDefault();
                const pos = getPointerPos(e);
                if (state._panStartX === undefined) {
                    state._panStartX = pos.x;
                    state._panStartOffset = state.offset;
                    return;
                }
                const dx = (state._panStartX - pos.x) / state.zoom;
                state.offset = Math.max(0, Math.min(state.duration - state.canvasWidth / state.zoom, state._panStartOffset +
                dx));
                render();
            }

            // ============================================================
            //  Event binding
            // ============================================================
            // ---- File load: button triggers hidden input ----
            loadBtn.addEventListener('click', () => {
                fileInput.click();
            });

            fileInput.addEventListener('change', (e) => {
                if (e.target.files && e.target.files.length > 0) {
                    loadAudioFile(e.target.files[0]);
                }
                e.target.value = ''; // allow re-selecting same file
            });

            // ---- BPM ----
            bpmInput.addEventListener('change', () => {
                let val = parseFloat(bpmInput.value);
                if (isNaN(val) || val < 20) val = 20;
                if (val > 300) val = 300;
                state.bpm = val;
                bpmInput.value = val;
                for (const m of state.markers) {
                    m.beatOffset = getBeatOffset(m.time);
                }
                updateUI();
                render();
            });

            bpmInput.addEventListener('input', () => {
                let val = parseFloat(bpmInput.value);
                if (!isNaN(val) && val >= 20 && val <= 300) {
                    state.bpm = val;
                    for (const m of state.markers) {
                        m.beatOffset = getBeatOffset(m.time);
                    }
                    updateUI();
                    render();
                }
            });

            // ---- Playback ----
            playBtn.addEventListener('click', playAudio);
            stopBtn.addEventListener('click', stopAudio);

            // ---- Detect ----
            detectBtn.addEventListener('click', () => {
                if (!state.bufferData) return;
                loadingOverlay.classList.add('active');
                loadingOverlay.querySelector('span').textContent = 'Detecting notes…';
                setTimeout(() => {
                    state.detectedTimes = detectOnsets(state.bufferData, state.sampleRate);
                    resetMarkersToDetected();
                    loadingOverlay.classList.remove('active');
                    loadingOverlay.querySelector('span').textContent = 'Processing audio…';
                    updateUI();
                    render();
                }, 100);
            });

            // ---- Reset ----
            resetBtn.addEventListener('click', resetMarkersToDetected);

            // ---- Canvas interactions ----
            canvas.addEventListener('mousedown', startDrag);
            canvas.addEventListener('mousemove', moveDrag);
            canvas.addEventListener('mouseup', endDrag);
            canvas.addEventListener('mouseleave', endDrag);

            canvas.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    startDrag(e);
                } else if (e.touches.length === 2) {
                    state._lastPinchDist = undefined;
                    handlePinch(e);
                }
            }, { passive: false });

            canvas.addEventListener('touchmove', (e) => {
                if (state.dragging && e.touches.length === 1) {
                    moveDrag(e);
                } else if (e.touches.length === 2) {
                    handlePinch(e);
                } else if (e.touches.length === 1 && !state.dragging) {
                    handlePan(e);
                }
            }, { passive: false });

            canvas.addEventListener('touchend', (e) => {
                if (state.dragging) {
                    endDrag(e);
                }
                state._panStartX = undefined;
                state._lastPinchDist = undefined;
            }, { passive: false });

            canvas.addEventListener('touchcancel', (e) => {
                if (state.dragging) endDrag(e);
                state._panStartX = undefined;
                state._lastPinchDist = undefined;
            }, { passive: false });

            // ---- Resize ----
            const ro = new ResizeObserver(() => {
                clearTimeout(state.resizeTimer);
                state.resizeTimer = setTimeout(() => {
                    resizeCanvas();
                }, 100);
            });
            ro.observe(wrap);

            // ---- Keyboard shortcuts ----
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT') return;
                if (e.code === 'Space') {
                    e.preventDefault();
                    playAudio();
                }
                if (e.code === 'Escape') {
                    stopAudio();
                }
            });

            // ============================================================
            //  Init
            // ============================================================
            function init() {
                resizeCanvas();
                state.zoom = Math.max(60, Math.min(400, state.canvasWidth / 8));
                updateUI();
                render();
                updateTimeDisplay();

                playBtn.disabled = true;
                stopBtn.disabled = true;
                detectBtn.disabled = true;
                resetBtn.disabled = true;

                document.addEventListener('visibilitychange', () => {
                    if (document.hidden && state.isPlaying) {
                        state.isPlaying = false;
                        state.pauseTime = state.currentTime;
                        if (state.source) {
                            try { state.source.stop(); } catch (_) {}
                            state.source = null;
                        }
                        playBtn.textContent = '▶ Play';
                        render();
                    }
                });
            }

            // Resume audio context on user gesture
            document.addEventListener('touchstart', () => {
                resumeAudioContext().catch(() => {});
            }, { passive: true });

            document.addEventListener('click', () => {
                resumeAudioContext().catch(() => {});
            }, { passive: true });

            init();
            window.__state = state;

        })();
    </script>

</body>
</html>
